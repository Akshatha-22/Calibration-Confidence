services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: calibration_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calibration_confidence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calibration_network

  # Redis for caching and pub/sub
  redis:
    image: redis:7-alpine
    container_name: calibration_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calibration_network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: calibration_backend
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/calibration_confidence"
      REDIS_URL: "redis://redis:6379"
      ENVIRONMENT: development
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./experiments:/app/experiments
      - ./models:/app/models
      - ./calibration:/app/calibration
      - ./checkpoints_deep_mlp:/app/checkpoints_deep_mlp
      - ./checkpoints_mlp:/app/checkpoints_mlp
      - ./checkpoints_vanilla_rnn:/app/checkpoints_vanilla_rnn
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - calibration_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: calibration_frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://backend:8000"
      NEXT_PUBLIC_WS_URL: "ws://backend:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - calibration_network

volumes:
  postgres_data:
  redis_data:

networks:
  calibration_network:
    driver: bridge
